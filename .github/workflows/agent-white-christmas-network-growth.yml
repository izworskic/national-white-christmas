name: Build White Christmas growth network

on:
  push:
    branches:
      - growth/white-christmas-network-2026-09-25

permissions:
  contents: write

jobs:
  build-network:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: growth/white-christmas-network-2026-09-25
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply selective network growth pass
        run: python scripts/agent_expand_white_christmas_network.py
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Generate and test full White Christmas network
        run: npm test
      - name: Commit verified network
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-white-christmas-network-growth.yml scripts/agent_expand_white_christmas_network.py
          git add data/white-christmas-cities.json package.json scripts/enhance-white-christmas-network.mjs public/assets/white-christmas-season.js public/national-tools/white-christmas public/white-christmas-route-manifest.json tests
          git commit -m "Expand White Christmas city network and seasonal discovery"
          git push origin HEAD:growth/white-christmas-network-2026-09-25
